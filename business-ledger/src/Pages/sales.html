<!-- Page: Daily stone sales (one table per month).
     Slots: print-title, toolbar (month navigation + actions), content (the table, or an empty state). -->
<div class="page wide">
    <div class="print-only">
        <h1 data-slot="print-title"></h1>
    </div>
    <div class="page-head no-print">
        <h1>Daily stone sales</h1>
        <span class="note">Cubes = cubic volume sold · Price = the sales amount for those cubes</span>
    </div>
    <div class="toolbar" data-slot="toolbar"></div>
    <div data-slot="content"></div>
</div>
