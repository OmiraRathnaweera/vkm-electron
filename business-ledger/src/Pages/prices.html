<!-- Page: Stone prices per cube (unit rates).
     Slots: rates-list, save-btn, sales-btn -->
<div class="page">
  <div class="page-head">
    <h1>Stone prices (1 Cube & 3 Cubes)</h1>
  </div>

  <div class="panel" style="max-width: 960px; margin-bottom: 20px;">
    <h2>Automatic calculation</h2>
  </div>

  <div class="rates-container" data-slot="rates-list"></div>

  <div class="table-actions no-print" style="margin-top: 24px;">
    <button type="button" class="btn primary" data-slot="save-btn">Save all rates</button>
    <button type="button" class="btn" data-slot="sales-btn">Open Daily sales ➔</button>
  </div>
</div>
