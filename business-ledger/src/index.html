<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Business Ledger</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">₨</div>
        <div class="brand-text">
          <div class="brand-name" id="brandName">Business Ledger</div>
          <div class="brand-sub">Works offline</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-view="ledger">
          <span class="nav-ico">▤</span> Ledger
        </button>
        <button class="nav-btn" data-view="reports">
          <span class="nav-ico">◔</span> Reports &amp; charts
        </button>
        <button class="nav-btn" data-view="settings">
          <span class="nav-ico">⚙</span> Settings &amp; backup
        </button>
      </nav>
      <div class="save-state" id="saveState" role="status" aria-live="polite">Loading…</div>
    </aside>

    <main class="main">
      <div id="view"></div>
    </main>
  </div>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script src="../node_modules/chart.js/dist/chart.umd.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
